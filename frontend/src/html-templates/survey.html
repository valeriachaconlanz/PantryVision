<!DOCTYPE html>
<html>
<head>
    <title>Dietary Preference Survey</title>
</head>

<body>
<h1> Dietary Preference Survey</h1>
<p>Please pick any of your dietary preferences so we can cater this app experience just to you and your needs!</p>

<h2>Please select any option(s) that would apply to you:</h2>
<form action="dashboard.html">
<input type="checkbox" id="diet1" name="lowcarb" value="Low_Carb">
<Label for="diet1">Low Carb</Label><br>

<input type="checkbox" id="diet2" name="keto" value="Keto">
<Label for="diet2">Keto</Label><br>

<input type="checkbox" id="diet3" name="paleo" value="paleo">
<Label for="diet3">Paleo</Label><br>

<input type="checkbox" id="diet4" name="vegan" value="vegan">
<Label for="diet4">Vegan</Label><br>

<input type="checkbox" id="diet5" name="veg" value="vegetarian">
<Label for="diet5">Vegetarian</Label><br>

<input type="checkbox" id="diet6" name="himac" value="high_macro">
<label for="diet6">High Macro</label><br>

<input type="checkbox" id="diet7" name="seedoil" value="no_seed_oil">
<label for="diet7">No Seed Oil</label><br>

<input type="checkbox" id="none" name="none" value="none_of_the_above">
<label for="none">None of the Above</label><br>

<button type="submit" class="submit-btn">Submit</button>
</form>

</body>



































</html>
