# Connects to our Supabase database.
# To use this: SPRING_PROFILES_ACTIVE=supabase ./mvnw spring-boot:run
# The values come from your .env file (see .env.example). There are no defaults on purpose
# so the app won't start if they're missing.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Always use SSL, even if someone forgets ?sslmode=require in the URL
spring.datasource.hikari.data-source-properties.sslmode=require

# The free Supabase pooler only allows a few connections and 6 of us share it, so keep this small
spring.datasource.hikari.maximum-pool-size=3

spring.h2.console.enabled=false
