spring.application.name=PantryVision
server.port=8080

# --- Database ---
# Default: in-memory H2 so the app runs with zero setup.
# Use the "postgres" profile (application-postgres.properties) for a real database.
spring.datasource.url=jdbc:h2:mem:pantryvision;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# --- External services (values come from environment variables, never commit keys) ---
pantryvision.llm.api-key=${LLM_API_KEY:}
pantryvision.recipe-api.api-key=${RECIPE_API_KEY:}

# --- Uploads (NFR-9: photos are compressed to ~2 MB in the browser) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

management.endpoints.web.exposure.include=health
