spring.application.name=PantryVision
server.port=8080

# Database
# Uses H2 (in memory) by default so you can run the app without setting anything up.
# To use PostgreSQL, run with the "postgres" profile (see application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:pantryvision;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# API keys come from your .env / environment variables. Don't put real keys here.
pantryvision.llm.api-key=${LLM_API_KEY:}
pantryvision.recipe-api.api-key=${RECIPE_API_KEY:}

# Upload limits (photos get compressed to about 2 MB in the browser first, NFR-9)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

management.endpoints.web.exposure.include=health
